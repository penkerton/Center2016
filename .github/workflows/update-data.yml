name: Update FHMMoscow data

# Данные обновляются каждые 3 часа. Пуш выполняется встроенным GITHUB_TOKEN,
# а такие пуши НЕ запускают другие workflow, поэтому деплой Pages сделан здесь же
# (pages.yml отвечает только за деплой обычных пушей в main).

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Общая группа с pages.yml: деплои Pages не должны накладываться друг на друга
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update data files
        run: node ./update_fhm_2016_stats.mjs

      - name: Validate generated data
        run: node --test

      - name: Detect data changes
        id: changes
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update FHMMoscow stats"

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: git push

      - name: Setup Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/deploy-pages@v5

      - name: No changes
        if: steps.changes.outputs.changed != 'true'
        run: echo "Данные не изменились — коммит и деплой не нужны."
