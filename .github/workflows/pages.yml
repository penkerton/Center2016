name: Deploy static site to GitHub Pages

# Обычные пуши в main. Пуш от бота из update-data.yml этот workflow не запускает
# (GITHUB_TOKEN не создаёт новых запусков), поэтому там деплой выполняется отдельно.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Общая группа с update-data.yml: деплои Pages не должны накладываться друг на друга
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
